name: Validar links wiki

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/**"
      - ".github/workflows/validar-links.yml"

jobs:
  validar-links:
    name: Verificar links [[wiki]] quebrados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar validação de links
        run: python3 scripts/validar_links.py .
